name: boba
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.1.0   # For loading environment variables
  http: ^1.3.0             # For making API requests to Flask backend
  dio: ^5.4.1              # (Optional) More advanced HTTP client with interceptors
  json_annotation: ^4.8.1  # (Optional) For JSON serialization
  shared_preferences: ^2.2.2  # For storing user login state locally
  flutter_secure_storage: ^9.0.0  # Secure storage for authentication tokens
  provider: 6.1.2  # State management (optional but useful)
  geolocator: ^11.0.0  # For getting user's location (since Boba is based on proximity)
  socket_io_client: ^2.0.3+1  # If you want real-time messaging via WebSockets
  flutter_local_notifications: ^17.1.2  # For local push notifications (optional)

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
